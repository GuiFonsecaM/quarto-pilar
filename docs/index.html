<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Quarto Pilar</title>
<meta name="description" content="Sinais de alerta sobre a saúde financeira dos bancos brasileiros, a partir de dados públicos do Banco Central e notícias, atualizados todos os dias.">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="lateral">
    <div class="cab">
      <div class="marca"><span class="ponto" aria-hidden="true"></span>Quarto Pilar</div>
      <div class="data" id="data">Bancos</div>
      <div class="links"><a href="validacao.html">Validação</a><a href="metodologia.html">Metodologia</a></div>
    </div>
    <label class="busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar" aria-label="Buscar banco" autocomplete="off">
    </label>
    <div class="segmentado" role="group" aria-label="Filtrar por nível">
      <button data-nivel="todos" aria-pressed="true">Todos</button>
      <button data-nivel="alerta" aria-pressed="false">Em alerta</button>
      <button data-nivel="Atenção" aria-pressed="false">Atenção</button>
      <button data-nivel="Normal" aria-pressed="false">Normal</button>
    </div>
    <div class="legenda-score">Número = <b>score de alerta</b>. Quanto maior, <b>mais sinais de risco</b>. Não é recomendação.</div>
    <div class="lista" id="lista" role="list"></div>
  </aside>
  <main class="detalhe" id="detalhe"><div class="boas-vindas">Carregando…</div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/comum.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
